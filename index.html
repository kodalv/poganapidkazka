<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Words Online</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Unbounded:wght@900&family=Inter:wght@400;500;700&display=swap');

        :root {
            --glass: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.14);
            --red: #ff4b2b;
            --blue: #00d2ff;
            --neutral: #e0e0e0;
            --panel: rgba(14, 14, 24, 0.78);
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            background:
                radial-gradient(circle at top right, rgba(0, 210, 255, 0.18), transparent 34rem),
                radial-gradient(circle at bottom left, rgba(255, 75, 43, 0.18), transparent 30rem),
                #0f0f1a;
            color: white;
            font-family: 'Inter', sans-serif;
            padding: 20px;
            overflow: hidden;
        }

        button,
        input {
            font: inherit;
        }

        button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 40px;
            padding: 0 14px;
            border: 1px solid var(--glass-border);
            background: rgba(255, 255, 255, 0.07);
            color: white;
            border-radius: 8px;
            cursor: pointer;
            line-height: 1;
            text-align: center;
            transition: 0.2s ease;
        }

        button:hover {
            background: rgba(255, 255, 255, 0.14);
        }

        button:disabled {
            opacity: 0.48;
            cursor: not-allowed;
        }

        .app {
            width: 100%;
            height: calc(100vh - 40px);
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .panel,
        .notice {
            background: var(--panel);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            backdrop-filter: blur(14px);
        }

        .brand {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-height: 132px;
            text-align: center;
        }

        .brand h1 {
            display: none;
        }

        h1 {
            margin: 0;
            font-family: 'Unbounded', sans-serif;
            font-size: clamp(2.1rem, 7vw, 4.6rem);
            line-height: 1.04;
            text-transform: uppercase;
            background: linear-gradient(180deg, #ffffff 0%, #b9b9c8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 18px rgba(255, 255, 255, 0.18));
        }

        .room-label,
        .status,
        .helper {
            color: #aeb2c4;
            font-size: 0.86rem;
        }

        .admin-menu {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 20;
            width: 282px;
            max-width: calc(100vw - 24px);
            pointer-events: none;
        }

        .menu-hotspot {
            position: absolute;
            top: -6px;
            right: -6px;
            width: 34px;
            height: 34px;
            padding: 0;
            border: 0;
            background: transparent;
            box-shadow: none;
            opacity: 0;
            z-index: 2;
            pointer-events: auto;
        }

        .menu-hotspot:focus-visible {
            opacity: 1;
            outline: 2px solid rgba(255, 255, 255, 0.45);
            outline-offset: 4px;
        }

        .menu-content {
            position: relative;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 11px;
            padding: 15px;
            background:
                linear-gradient(145deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.025)),
                rgba(16, 16, 27, 0.76);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.11),
                0 18px 54px rgba(0, 0, 0, 0.56);
            backdrop-filter: blur(22px) saturate(1.18);
            opacity: 0;
            pointer-events: none;
            transform: translateY(-6px) scale(0.98);
            transform-origin: top right;
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        .admin-menu.open .menu-content {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0) scale(1);
        }

        .admin-menu.open {
            pointer-events: auto;
        }

        @media (hover: hover) and (pointer: fine) {
            .admin-menu:hover .menu-content,
            .admin-menu:focus-within .menu-content {
                opacity: 1;
                pointer-events: auto;
                transform: translateY(0) scale(1);
            }

            .admin-menu::before {
                content: "";
                position: absolute;
                inset: -14px;
                pointer-events: auto;
            }
        }

        .menu-content button {
            height: 49px;
            width: 100%;
            font-size: 1.02rem;
            font-weight: 700;
        }

        .menu-label {
            color: #666d83;
            font-size: 0.68rem;
            font-weight: 800;
            letter-spacing: 0.18em;
            text-align: center;
            text-transform: uppercase;
        }

        .mode-status {
            min-height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 10px;
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.055);
            color: #d6daea;
            font-size: 0.78rem;
            font-weight: 800;
            text-align: center;
            text-transform: uppercase;
        }

        .primary {
            background: linear-gradient(135deg, #45cfff, #4f83e8);
            border: none;
            font-weight: 800;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.32), 0 10px 26px rgba(0, 145, 255, 0.22);
        }

        .active-state {
            background: rgba(96, 255, 184, 0.18);
            border-color: rgba(96, 255, 184, 0.42);
            color: #a7ffd4;
            opacity: 1;
        }

        .danger {
            color: #ffb4a8;
        }

        .role-switch,
        .link-switch,
        .json-switch {
            display: inline-flex;
            width: 100%;
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.055);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
        }

        .role-switch button,
        .link-switch button,
        .json-switch button {
            flex: 1;
            height: 49px;
            width: auto;
            min-width: 0;
            border: 0;
            border-radius: 0;
            line-height: 1;
            background: transparent;
        }

        .role-switch button {
            font-size: 0.88rem;
        }

        .link-switch button {
            height: 38px;
            font-size: 0.72rem;
            letter-spacing: 0.01em;
        }

        .json-switch button {
            height: 38px;
            font-size: 0.78rem;
            font-weight: 800;
        }

        .link-switch button.copied {
            background: rgba(96, 255, 184, 0.18);
            color: #a7ffd4;
        }

        .role-switch button + button,
        .link-switch button + button,
        .json-switch button + button {
            border-left: 1px solid var(--glass-border);
        }

        .role-switch button.active {
            background: white;
            color: #111;
            font-weight: 800;
        }

        .notice {
            display: none;
            padding: 12px 14px;
            color: #ffd7cf;
            line-height: 1.45;
        }

        .notice.visible {
            display: block;
        }

        .stage {
            display: grid;
            grid-template-columns: minmax(0, 1fr);
            flex: 1;
            min-height: 0;
            min-width: 0;
        }

        .stage.captain {
            grid-template-columns: 1fr;
        }

        .panel {
            min-width: 0;
            min-height: 0;
            padding: 16px;
        }

        .player-panel.hidden {
            display: none;
        }

        .panel-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 14px;
        }

        .panel-title h2 {
            margin: 0;
            font-size: 0.88rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #b9bdd0;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(5, minmax(0, 1fr));
            grid-template-rows: repeat(5, minmax(0, 1fr));
            gap: 10px;
            height: 100%;
            min-width: 0;
            min-height: 0;
        }

        .card,
        .captain-card {
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            min-width: 0;
            overflow: hidden;
        }

        .card {
            min-height: 0;
            background: var(--glass);
            padding: clamp(4px, 1vw, 8px);
            cursor: pointer;
            transition: 0.25s ease;
        }

        .card input,
        .captain-card span {
            min-width: 0;
            width: 100%;
            border: 0;
            outline: 0;
            background: transparent;
            color: white;
            text-align: center;
            font-weight: 700;
            text-transform: uppercase;
            overflow-wrap: anywhere;
            white-space: nowrap;
            line-height: 1;
        }

        .card input {
            font-size: clamp(1rem, 1.9vw, 1.5rem);
        }

        .card input:disabled {
            opacity: 1;
            -webkit-text-fill-color: currentColor;
        }

        .card.red,
        .captain-card.red {
            background: rgba(255, 75, 43, 0.28);
            border-color: var(--red);
        }

        .card.blue,
        .captain-card.blue {
            background: rgba(0, 210, 255, 0.28);
            border-color: var(--blue);
        }

        .card.neutral,
        .captain-card.neutral {
            background: rgba(224, 224, 224, 0.48);
            border-color: var(--neutral);
        }

        .card.neutral input,
        .captain-card.neutral span {
            color: #111;
        }

        .card.black,
        .captain-card.black {
            background: rgba(0, 0, 0, 0.76);
            border-color: var(--red);
        }

        .game-active .player-grid .card {
            background: rgba(255, 255, 255, 0.045);
            border-color: var(--glass-border);
        }

        .game-active:not(.editor-active) .player-grid .card {
            cursor: default;
        }

        .game-active .player-grid .card input {
            color: white;
            pointer-events: none;
        }

        .game-active.editing-active .player-grid .card input {
            pointer-events: auto;
        }

        .game-active .player-grid .card.revealed.red {
            background: linear-gradient(135deg, #ff4b2b, #ff416c);
            box-shadow: 0 0 24px rgba(255, 75, 43, 0.36);
        }

        .game-active .player-grid .card.revealed.blue {
            background: linear-gradient(135deg, #00d2ff, #3a7bd5);
            box-shadow: 0 0 24px rgba(0, 210, 255, 0.36);
        }

        .game-active .player-grid .card.revealed.neutral {
            background: #e0e0e0;
        }

        .game-active .player-grid .card.revealed.neutral input {
            color: #111;
        }

        .game-active .player-grid .card.revealed.black {
            background: #000;
            border-color: var(--red);
            box-shadow: 0 0 28px rgba(255, 0, 0, 0.42);
        }

        .editor-active .player-grid .card.red {
            background: rgba(255, 75, 43, 0.28);
            border-color: var(--red);
        }

        .editor-active .player-grid .card.blue {
            background: rgba(0, 210, 255, 0.28);
            border-color: var(--blue);
        }

        .editor-active .player-grid .card.neutral {
            background: rgba(224, 224, 224, 0.48);
            border-color: var(--neutral);
        }

        .editor-active .player-grid .card.neutral input {
            color: #111;
        }

        .editor-active .player-grid .card.black {
            background: rgba(0, 0, 0, 0.76);
            border-color: var(--red);
        }

        .editor-active .player-grid .card.played {
            opacity: 0.48;
            filter: grayscale(0.25);
        }

        .editor-active .player-grid .card.played input {
            text-decoration: line-through;
            text-decoration-thickness: 3px;
            text-decoration-color: rgba(255, 255, 255, 0.88);
        }

        .editor-active .player-grid .card.played.neutral input {
            text-decoration-color: rgba(0, 0, 0, 0.72);
        }

        .captain-panel {
            display: none;
        }

        .captain-panel.visible {
            display: block;
        }

        .captain-grid {
            grid-template-columns: repeat(5, minmax(0, 1fr));
            gap: 7px;
        }

        .stage.captain .captain-grid {
            gap: 10px;
        }

        .captain-card {
            min-height: 0;
            padding: 5px;
        }

        .stage.captain .captain-card {
            padding: clamp(4px, 1vw, 8px);
        }

        .captain-card span {
            font-size: clamp(0.92rem, 1.55vw, 1.25rem);
            line-height: 1;
        }

        .stage.captain .captain-card span {
            font-size: clamp(1rem, 1.9vw, 1.5rem);
        }

        .captain-card.played {
            opacity: 0.48;
            filter: grayscale(0.25);
        }

        .captain-card.played span {
            text-decoration: line-through;
            text-decoration-thickness: 3px;
            text-decoration-color: rgba(255, 255, 255, 0.88);
        }

        .captain-card.played.neutral span {
            text-decoration-color: rgba(0, 0, 0, 0.72);
        }

        .captain-card.played::after {
            content: "";
            position: absolute;
            inset: 7px;
            border: 1px solid rgba(255, 255, 255, 0.42);
            border-radius: 6px;
            pointer-events: none;
        }

        .helper {
            margin: 10px 0 0;
            color: #8d92a8;
        }

        @media (max-width: 1080px) {
            .stage.captain {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 920px) {
            body {
                padding: 12px;
            }

            .app {
                height: calc(100vh - 24px);
            }

            .brand {
                align-items: center;
                min-height: 104px;
            }

            .admin-menu {
                top: 12px;
                right: 12px;
                width: min(282px, calc(100vw - 24px));
            }

            .grid {
                grid-template-columns: repeat(5, minmax(0, 1fr));
                gap: 7px;
            }

            .card {
                padding: 4px;
            }

            .card input {
                font-size: clamp(0.8rem, 2.6vw, 1rem);
            }
        }
    </style>
</head>
<body id="mainBody">
    <main class="app">
        <header class="brand">
            <h1>Пога<br>Напід<br>Казка</h1>
        </header>

        <div class="admin-menu" id="adminMenu">
            <button class="menu-hotspot" type="button" aria-label="Відкрити меню" onclick="toggleMenu(event)"></button>
            <div class="menu-content">
                <span class="menu-label">Меню</span>
                <div class="role-switch" aria-label="Роль">
                    <button id="playerRoleBtn" type="button" onclick="setRole('player')">Гравець</button>
                    <button id="editorRoleBtn" type="button" onclick="setRole('editor')">Редактор</button>
                    <button id="captainRoleBtn" type="button" onclick="setRole('captain')">Капітан</button>
                </div>
                <div class="mode-status" id="modeStatus"></div>
                
                <button class="primary" id="startBtn" type="button" onclick="handleStart()">Почати гру</button>
                <button id="editBtn" type="button" onclick="enableEditor()">Редагувати</button>
                
                <div class="json-switch" id="jsonTools" aria-label="JSON">
                    <button type="button" onclick="downloadBoardJson()">Зберегти JSON</button>
                    <button type="button" onclick="uploadBoardJson()">Підвантажити JSON</button>
                </div>
                <input id="jsonFileInput" type="file" accept="application/json,.json" hidden>

                <div class="link-switch" aria-label="Копіювати лінк">
                    <button type="button" onclick="copyRoomLink('player', this)">Лінк гравця</button>
                    <button type="button" onclick="copyRoomLink('editor', this)">Лінк редактора</button>
                    <button type="button" onclick="copyRoomLink('captain', this)">Лінк капітана</button>
                </div>
                <button id="resetBtn" class="danger" type="button" onclick="resetGame()">Очистити</button>
            </div>
        </div>

        <div class="notice" id="setupNotice"></div>

        <section class="stage" id="stage">
            <section class="panel player-panel" id="playerPanel">
                <div class="grid player-grid" id="grid"></div>
            </section>

            <aside class="panel captain-panel" id="captainPanel">
                <div class="grid captain-grid" id="captainGrid"></div>
            </aside>
        </section>
    </main>

    <script type="module">
        const firebaseConfig = {
            apiKey: "AIzaSyCruWcqmqgNe9fJVUIAED9EwAcwkX2gDfo",
            authDomain: "code-words-b22d5.firebaseapp.com",
            databaseURL: "https://code-words-b22d5-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "code-words-b22d5",
            storageBucket: "code-words-b22d5.firebasestorage.app",
            messagingSenderId: "91112864757",
            appId: "1:91112864757:web:89ea16b13c058e8bchbbebc"
        };

        const params = new URLSearchParams(location.search);
        const roomId = 'main';
        let role = ['player', 'editor', 'captain'].includes(params.get('role')) ? params.get('role') : 'player';
        const colors = ['default', 'red', 'blue', 'neutral', 'black'];
        const firebaseIsConfigured = !Object.values(firebaseConfig).some(value => value.startsWith('PASTE_'));

        const grid = document.getElementById('grid');
        const playerPanel = document.getElementById('playerPanel');
        const captainGrid = document.getElementById('captainGrid');
        const captainPanel = document.getElementById('captainPanel');
        const adminMenu = document.getElementById('adminMenu');
        const mainBody = document.getElementById('mainBody');
        const stage = document.getElementById('stage');
        const startBtn = document.getElementById('startBtn');
        const editBtn = document.getElementById('editBtn');
        const resetBtn = document.getElementById('resetBtn');
        const jsonTools = document.getElementById('jsonTools');
        const jsonFileInput = document.getElementById('jsonFileInput');
        const modeStatus = document.getElementById('modeStatus');
        const setupNotice = document.getElementById('setupNotice');

        let db = null;
        let roomRef = null;
        let state = createEmptyState();
        let isRendering = false;
        let editorIsEditing = false;
        let wordSaveTimers = {};
        let serverTimestamp = () => Date.now();
        let firebaseApi = null;
        let measureContext = null;

        window.handleStart = handleStart;
        window.enableEditor = enableEditor;
        window.resetGame = resetGame;
        window.setRole = setRole;
        window.copyRoomLink = copyRoomLink;
        window.toggleMenu = toggleMenu;
        window.downloadBoardJson = downloadBoardJson;
        window.uploadBoardJson = uploadBoardJson;

        function createEmptyState() {
            return {
                isGameMode: false,
                updatedAt: Date.now(),
                cards: Array.from({ length: 25 }, () => ({
                    word: '',
                    colorIndex: 0,
                    revealed: false
                })),
                draftCards: null
            };
        }

        function normalizeState(nextState = {}) {
            const fallback = createEmptyState();
            const cards = normalizeCards(nextState.cards, fallback.cards);
            const draftCards = Array.isArray(nextState.draftCards) ? normalizeCards(nextState.draftCards, cards) : null;

            return {
                isGameMode: Boolean(nextState.isGameMode),
                updatedAt: nextState.updatedAt || Date.now(),
                cards,
                draftCards
            };
        }

        function normalizeCards(cards = [], fallbackCards = []) {
            const fallback = fallbackCards.length ? fallbackCards : createEmptyState().cards;

            return fallback.map((card, index) => ({
                word: String(cards[index]?.word ?? card.word),
                colorIndex: Math.max(0, Math.min(colors.length - 1, Number(cards[index]?.colorIndex ?? card.colorIndex))),
                revealed: Boolean(cards[index]?.revealed ?? card.revealed)
            }));
        }

        function getEditorCards() {
            return editorIsEditing ? (state.draftCards || state.cards) : state.cards;
        }

        function getVisibleCards() {
            return role === 'editor' ? getEditorCards() : state.cards;
        }

        function roomPath() {
            return `rooms/${roomId}`;
        }

        async function initOnlineRoom() {
            if (!firebaseIsConfigured) {
                setupNotice.classList.add('visible');
                setupNotice.textContent = 'Firebase ще не повністю підключений. Перевір firebaseConfig і додай databaseURL з Realtime Database.';
                render();
                return;
            }

            const appModule = await import('https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js');
            const databaseModule = await import('https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js');
            firebaseApi = databaseModule;
            serverTimestamp = databaseModule.serverTimestamp;

            const app = appModule.initializeApp(firebaseConfig);
            db = databaseModule.getDatabase(app);
            roomRef = databaseModule.ref(db, roomPath());

            const snapshot = await firebaseApi.get(roomRef);
            if (!snapshot.exists()) {
                await firebaseApi.set(roomRef, {
                    ...createEmptyState(),
                    createdAt: serverTimestamp(),
                    updatedAt: serverTimestamp()
                });
            }

            firebaseApi.onValue(roomRef, snapshotValue => {
                state = normalizeState(snapshotValue.val());
                render();
            });
        }

        function render() {
            const activeInput = document.activeElement?.dataset?.cardIndex;
            const selectionStart = document.activeElement?.selectionStart;
            const selectionEnd = document.activeElement?.selectionEnd;

            isRendering = true;
            mainBody.classList.toggle('game-active', state.isGameMode);
            mainBody.classList.toggle('editor-active', role === 'editor');
            mainBody.classList.toggle('editing-active', role === 'editor' && editorIsEditing);
            stage.classList.toggle('captain', role === 'captain');
            playerPanel.classList.toggle('hidden', role === 'captain');
            captainPanel.classList.toggle('visible', role === 'captain');
            
            // Ховаємо або показуємо кнопки управління грою залежно від ролі
            updateEditorControls();

            document.getElementById('playerRoleBtn').classList.toggle('active', role === 'player');
            document.getElementById('editorRoleBtn').classList.toggle('active', role === 'editor');
            document.getElementById('captainRoleBtn').classList.toggle('active', role === 'captain');

            grid.innerHTML = '';
            captainGrid.innerHTML = '';

            getVisibleCards().forEach((card, index) => {
                grid.appendChild(createPlayerCard(card, index));
            });

            state.cards.forEach(card => {
                captainGrid.appendChild(createCaptainCard(card));
            });

            isRendering = false;
            fitAllCardText();

            if (role === 'editor' && editorIsEditing && activeInput !== undefined) {
                const nextInput = grid.querySelector(`input[data-card-index="${activeInput}"]`);
                if (nextInput && !nextInput.disabled) {
                    nextInput.focus();
                    nextInput.setSelectionRange(selectionStart ?? nextInput.value.length, selectionEnd ?? nextInput.value.length);
                }
            }
        }

        function createPlayerCard(cardData, index) {
            const card = document.createElement('div');
            card.className = `card ${colors[cardData.colorIndex]}`;
            if (cardData.revealed) card.classList.add('revealed');
            if (role === 'editor' && cardData.revealed) card.classList.add('played');

            const input = document.createElement('input');
            input.type = 'text';
            input.value = cardData.word;
            input.placeholder = '...';
            // Тільки Редактор може вводити текст
            input.dataset.cardIndex = index;
            input.disabled = role !== 'editor' || !editorIsEditing || !firebaseIsConfigured;
            input.addEventListener('click', event => event.stopPropagation());
            input.addEventListener('input', () => {
                if (role !== 'editor') return; // Перевірка безпеки
                if (!editorIsEditing) return;
                ensureLocalDraftCards();
                state.draftCards[index].word = input.value;
                fitTextElement(input);
                queueWordSave(index, input.value);
            });

            card.appendChild(input);
            card.addEventListener('click', () => {
                if (!firebaseIsConfigured || role !== 'editor') return; // Кліки працюють тільки для Редактора

                if (editorIsEditing) {
                    ensureLocalDraftCards();
                    const nextColorIndex = (state.draftCards[index].colorIndex + 1) % colors.length;
                    state.draftCards[index].colorIndex = nextColorIndex;
                    card.className = `card ${colors[nextColorIndex]}`;
                    if (state.draftCards[index].revealed) card.classList.add('revealed', 'played');
                    updateDraftCard(index, {
                        colorIndex: nextColorIndex
                    });
                } else if (role === 'editor' && state.cards[index].word.trim()) {
                    updateCard(index, { revealed: true });
                }
            });

            return card;
        }

        function updateEditorControls() {
            const isEditor = role === 'editor';
            const display = isEditor ? 'inline-flex' : 'none';

            startBtn.style.display = display;
            editBtn.style.display = display;
            resetBtn.style.display = display;
            jsonTools.style.display = display;
            modeStatus.style.display = isEditor ? 'flex' : 'none';

            editBtn.classList.toggle('active-state', editorIsEditing);
            editBtn.disabled = !isEditor || editorIsEditing;
            startBtn.disabled = !isEditor || (state.isGameMode && !editorIsEditing);

            if (editorIsEditing) {
                modeStatus.textContent = state.isGameMode ? 'Редагування під час гри' : 'Редагування поля';
                editBtn.textContent = 'Редагування увімкнено';
                startBtn.textContent = state.isGameMode ? 'Зберегти і показати гравцям' : 'Зберегти і почати гру';
                return;
            }

            if (state.isGameMode) {
                modeStatus.textContent = 'Гра йде';
                editBtn.textContent = 'Редагувати під час гри';
                startBtn.textContent = 'Гра вже йде';
                return;
            }

            modeStatus.textContent = 'Гра ще не почалась';
            editBtn.textContent = 'Редагувати поле';
            startBtn.textContent = 'Почати гру';
        }

        function createCaptainCard(cardData) {
            const card = document.createElement('div');
            card.className = `captain-card ${colors[cardData.colorIndex]}`;
            if (cardData.revealed) card.classList.add('played');

            const word = document.createElement('span');
            word.textContent = cardData.word || '???';
            card.appendChild(word);
            return card;
        }

        function cloneCards(cards) {
            return cards.map(card => ({ ...card }));
        }

        function ensureLocalDraftCards() {
            if (!state.draftCards) {
                state.draftCards = cloneCards(state.cards);
            }
        }

        function queueWordSave(index, word) {
            if (!firebaseIsConfigured || isRendering) return;
            ensureLocalDraftCards();
            state.draftCards[index].word = word;
            clearTimeout(wordSaveTimers[index]);
            wordSaveTimers[index] = setTimeout(() => {
                updateDraftCard(index, { word });
            }, 220);
        }

        async function updateCard(index, patch) {
            if (!roomRef) return;

            const updates = {};
            Object.entries(patch).forEach(([key, value]) => {
                updates[`cards/${index}/${key}`] = value;
            });
            updates.updatedAt = serverTimestamp();

            await firebaseApi.update(roomRef, updates);
        }

        async function updateDraftCard(index, patch) {
            if (!roomRef) return;

            const updates = {};
            Object.entries(patch).forEach(([key, value]) => {
                updates[`draftCards/${index}/${key}`] = value;
            });
            updates.updatedAt = serverTimestamp();

            await firebaseApi.update(roomRef, updates);
        }

        async function handleStart() {
            if (!roomRef || role !== 'editor') return; // Запуск гри тільки для Редактора
            const cardsToPublish = cloneCards(state.draftCards || state.cards).map(card => ({
                ...card,
                revealed: state.isGameMode ? Boolean(card.revealed) : false
            }));

            editorIsEditing = false;
            await firebaseApi.update(roomRef, {
                isGameMode: true,
                cards: cardsToPublish,
                draftCards: null,
                updatedAt: serverTimestamp()
            });
        }

        async function enableEditor() {
            if (!roomRef || role !== 'editor') return; // Повернення до редагування тільки для Редактора

            editorIsEditing = true;
            state.draftCards = cloneCards(state.cards);
            await firebaseApi.update(roomRef, {
                draftCards: state.draftCards,
                updatedAt: serverTimestamp()
            });
            render();
        }

        async function resetGame() {
            if (!roomRef || role !== 'editor' || !confirm('Скинути кімнату?')) return; // Скидання тільки для Редактора

            await firebaseApi.set(roomRef, {
                ...createEmptyState(),
                updatedAt: serverTimestamp()
            });
        }

        function downloadBoardJson() {
            if (role !== 'editor') return;

            const payload = {
                version: 1,
                exportedAt: new Date().toISOString(),
                cards: cloneCards(getEditorCards()).map(card => ({
                    word: card.word,
                    colorIndex: card.colorIndex,
                    revealed: Boolean(card.revealed)
                }))
            };
            const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `poganapidkazka-${new Date().toISOString().slice(0, 10)}.json`;
            document.body.appendChild(link);
            link.click();
            link.remove();
            URL.revokeObjectURL(link.href);
        }

        function uploadBoardJson() {
            if (role !== 'editor') return;

            jsonFileInput.value = '';
            jsonFileInput.click();
        }

        async function handleJsonFileChange(event) {
            const file = event.target.files?.[0];
            if (!file || role !== 'editor') return;

            try {
                const payload = JSON.parse(await file.text());
                const importedCards = normalizeImportedCards(payload);

                editorIsEditing = true;
                state.draftCards = importedCards;

                if (roomRef) {
                    await firebaseApi.update(roomRef, {
                        draftCards: importedCards,
                        updatedAt: serverTimestamp()
                    });
                }

                render();
            } catch (error) {
                alert(`Не вдалося підвантажити JSON: ${error.message}`);
            }
        }

        function normalizeImportedCards(payload) {
            const imported = Array.isArray(payload)
                ? payload
                : (Array.isArray(payload?.cards) ? payload.cards : payload?.draftCards);

            if (!Array.isArray(imported)) {
                throw new Error('у файлі немає масиву cards');
            }

            return normalizeCards(imported, createEmptyState().cards);
        }

        function setRole(nextRole) {
            role = nextRole;
            if (role !== 'editor') editorIsEditing = false;
            params.set('role', role);
            history.replaceState(null, '', `${location.pathname}?${params.toString()}`);
            render();
        }

        async function copyRoomLink(linkRole, button) {
            const url = new URL(location.href);
            url.searchParams.set('role', linkRole);

            try {
                await navigator.clipboard.writeText(url.toString());
                showCopiedState(button);
            } catch {
                prompt('Лінк кімнати:', url.toString());
            }
        }

        function toggleMenu(event) {
            event.stopPropagation();
            adminMenu.classList.toggle('open');
        }

        function showCopiedState(button) {
            if (!button) return;

            const originalText = button.textContent;
            button.textContent = 'Скопійовано';
            button.classList.add('copied');
            button.disabled = true;

            setTimeout(() => {
                button.textContent = originalText;
                button.classList.remove('copied');
                button.disabled = false;
            }, 1200);
        }

        function fitAllCardText() {
            document.querySelectorAll('.card input, .captain-card span').forEach(fitTextElement);
        }

        function fitTextElement(element) {
            const text = (element.value ?? element.textContent ?? '').trim().toUpperCase();
            const parent = element.parentElement;
            if (!parent || !text) {
                element.style.fontSize = '';
                return;
            }

            const styles = getComputedStyle(element);
            const maxSize = Math.min(parent.clientHeight * 0.38, parent.clientWidth * 0.16, 24);
            const minSize = 8;
            const availableWidth = Math.max(20, (element.clientWidth || parent.clientWidth) - 6);
            measureContext ||= document.createElement('canvas').getContext('2d');
            measureContext.font = `${styles.fontWeight} ${maxSize}px ${styles.fontFamily}`;

            const measuredWidth = measureContext.measureText(text).width;
            const fittedSize = measuredWidth > availableWidth
                ? Math.max(minSize, Math.floor(maxSize * availableWidth / measuredWidth))
                : maxSize;

            element.style.fontSize = `${fittedSize}px`;
        }

        document.addEventListener('click', event => {
            if (!adminMenu.classList.contains('open')) return;
            if (adminMenu.contains(event.target)) return;
            adminMenu.classList.remove('open');
        });

        document.addEventListener('keydown', event => {
            if (event.key === 'Escape') {
                adminMenu.classList.remove('open');
            }
        });

        jsonFileInput.addEventListener('change', handleJsonFileChange);

        initOnlineRoom().catch(error => {
            setupNotice.classList.add('visible');
            setupNotice.textContent = `Firebase помилка: ${error.message}`;
            render();
        });
    </script>
</body>
</html>
