<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Words Online</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Unbounded:wght@900&family=Inter:wght@400;500;700&display=swap');

        :root {
            --glass: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.14);
            --red: #ff4b2b;
            --blue: #00d2ff;
            --neutral: #e0e0e0;
            --panel: rgba(14, 14, 24, 0.78);
        }

        * { box-sizing: border-box; }
        html, body { min-height: 100%; margin: 0; }

        body {
            background:
                radial-gradient(circle at top right, rgba(0, 210, 255, 0.18), transparent 34rem),
                radial-gradient(circle at bottom left, rgba(255, 75, 43, 0.18), transparent 30rem),
                #0f0f1a;
            color: white;
            font-family: 'Inter', sans-serif;
            padding: 20px;
        }

        button, input { font: inherit; }

        button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 40px;
            padding: 0 14px;
            border: 1px solid var(--glass-border);
            background: rgba(255, 255, 255, 0.07);
            color: white;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s ease;
        }

        button:hover { background: rgba(255, 255, 255, 0.14); }
        button:disabled { opacity: 0.48; cursor: not-allowed; }

        .app {
            width: min(1180px, 100%);
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .panel {
            background: var(--panel);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            backdrop-filter: blur(14px);
            padding: 20px;
            min-height: 100px; /* Запобігає схлопуванню */
        }

        .brand {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 132px;
            text-align: center;
        }

        h1 {
            margin: 0;
            font-family: 'Unbounded', sans-serif;
            font-size: clamp(2.1rem, 7vw, 4.6rem);
            line-height: 1.04;
            text-transform: uppercase;
            background: linear-gradient(180deg, #ffffff 0%, #b9b9c8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .admin-menu {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 20;
            width: 282px;
        }

        .menu-hotspot {
            position: absolute;
            top: -6px;
            right: -6px;
            width: 34px;
            height: 34px;
            background: transparent;
            border: 0;
            cursor: pointer;
        }

        .menu-content {
            display: flex;
            flex-direction: column;
            gap: 11px;
            padding: 15px;
            background: rgba(16, 16, 27, 0.9);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            backdrop-filter: blur(22px);
            opacity: 0;
            pointer-events: none;
            transform: translateY(-6px);
            transition: 0.2s ease;
        }

        .admin-menu.open .menu-content {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0);
        }

        .menu-label {
            color: #666d83;
            font-size: 0.68rem;
            font-weight: 800;
            text-align: center;
            text-transform: uppercase;
        }

        .primary { background: linear-gradient(135deg, #45cfff, #4f83e8); border: none; font-weight: 800; }
        .danger { color: #ffb4a8; }

        .role-switch, .link-switch {
            display: flex;
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            overflow: hidden;
        }

        .role-switch button, .link-switch button {
            flex: 1;
            height: 44px;
            border: 0;
            border-radius: 0;
            background: transparent;
        }

        .role-switch button.active { background: white; color: #111; font-weight: 800; }

        .stage { display: grid; gap: 18px; }
        .player-panel.hidden { display: none; }
        .captain-panel { display: none; }
        .captain-panel.visible { display: block; }

        .grid {
            display: grid;
            grid-template-columns: repeat(5, minmax(0, 1fr));
            gap: 10px;
        }

        .card, .captain-card {
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            aspect-ratio: 1.55 / 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card { background: var(--glass); cursor: pointer; }
        .card input {
            width: 100%;
            background: transparent;
            border: 0;
            color: white;
            text-align: center;
            font-weight: 700;
            text-transform: uppercase;
        }

        .card.red, .captain-card.red { background: rgba(255, 75, 43, 0.3); border-color: var(--red); }
        .card.blue, .captain-card.blue { background: rgba(0, 210, 255, 0.3); border-color: var(--blue); }
        .card.neutral, .captain-card.neutral { background: rgba(224, 224, 224, 0.5); border-color: var(--neutral); }
        .card.neutral input { color: #111; }
        .card.black, .captain-card.black { background: rgba(0, 0, 0, 0.8); border-color: var(--red); }

        .game-active .card.revealed.red { background: var(--red); }
        .game-active .card.revealed.blue { background: var(--blue); }
        .game-active .card.revealed.neutral { background: var(--neutral); }
        .game-active .card.revealed.black { background: #000; }

        @media (max-width: 920px) {
            .grid { gap: 6px; }
            .card input { font-size: 0.7rem; }
        }
    </style>
</head>
<body id="mainBody">
    <main class="app">
        <header class="brand">
            <h1>Пога<br>Напід<br>Казка</h1>
        </header>

        <div class="admin-menu" id="adminMenu">
            <button class="menu-hotspot" onclick="toggleMenu(event)"></button>
            <div class="menu-content">
                <span class="menu-label">Меню</span>
                <div class="role-switch">
                    <button id="playerRoleBtn" onclick="setRole('player')">Гравець</button>
                    <button id="editorRoleBtn" onclick="setRole('editor')">Редактор</button>
                    <button id="captainRoleBtn" onclick="setRole('captain')">Капітан</button>
                </div>
                <button class="primary" id="startBtn" onclick="handleStart()">Почати гру</button>
                <button id="editBtn" onclick="enableEditor()">Редагувати</button>
                <div class="link-switch">
                    <button onclick="copyRoomLink('player', this)">Гравець</button>
                    <button onclick="copyRoomLink('editor', this)">Редактор</button>
                    <button onclick="copyRoomLink('captain', this)">Капітан</button>
                </div>
                <button id="resetBtn" class="danger" onclick="resetGame()">Очистити</button>
            </div>
        </div>

        <section class="stage" id="stage">
            <section class="panel player-panel" id="playerPanel">
                <div class="grid player-grid" id="grid"></div>
            </section>

            <aside class="panel captain-panel" id="captainPanel">
                <div class="grid captain-grid" id="captainGrid"></div>
            </aside>
        </section>
    </main>

    <script type="module">
        const firebaseConfig = {
            apiKey: "AIzaSyCruWcqmqgNe9fJVUIAED9EwAcwkX2gDfo",
            authDomain: "code-words-b22d5.firebaseapp.com",
            databaseURL: "https://code-words-b22d5-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "code-words-b22d5",
            storageBucket: "code-words-b22d5.firebasestorage.app",
            messagingSenderId: "91112864757",
            appId: "1:91112864757:web:89ea16b13c058e8bchbbebc"
        };

        const params = new URLSearchParams(location.search);
        let role = params.get('role') || 'player';
        const colors = ['default', 'red', 'blue', 'neutral', 'black'];

        const grid = document.getElementById('grid');
        const captainGrid = document.getElementById('captainGrid');
        const mainBody = document.getElementById('mainBody');
        const startBtn = document.getElementById('startBtn');
        const editBtn = document.getElementById('editBtn');
        const resetBtn = document.getElementById('resetBtn');

        let db, roomRef, state = { cards: [] };
        let firebaseApi;

        window.toggleMenu = (e) => { e.stopPropagation(); document.getElementById('adminMenu').classList.toggle('open'); };
        window.setRole = (r) => { role = r; params.set('role', r); history.replaceState(null, '', `?${params.toString()}`); render(); };

        async function init() {
            const { initializeApp } = await import('https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js');
            const api = await import('https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js');
            firebaseApi = api;
            const app = initializeApp(firebaseConfig);
            db = api.getDatabase(app);
            roomRef = api.ref(db, 'rooms/main');

            api.onValue(roomRef, snap => {
                const data = snap.val();
                if (data) { state = data; render(); }
            });
        }

        function render() {
            const isEditor = role === 'editor';
            mainBody.classList.toggle('game-active', state.isGameMode);
            document.getElementById('playerPanel').classList.toggle('hidden', role === 'captain');
            document.getElementById('captainPanel').classList.toggle('visible', role === 'captain');
            
            startBtn.style.display = (state.isGameMode || !isEditor) ? 'none' : 'block';
            editBtn.style.display = isEditor ? 'block' : 'none';
            resetBtn.style.display = isEditor ? 'block' : 'none';

            grid.innerHTML = '';
            captainGrid.innerHTML = '';

            state.cards.forEach((c, i) => {
                const card = document.createElement('div');
                card.className = `card ${colors[c.colorIndex]} ${c.revealed ? 'revealed' : ''}`;
                const inp = document.createElement('input');
                inp.value = c.word;
                inp.disabled = state.isGameMode || !isEditor;
                inp.oninput = (e) => updateCard(i, { word: e.target.value });
                card.onclick = () => {
                    if (!isEditor) return;
                    if (!state.isGameMode) updateCard(i, { colorIndex: (c.colorIndex + 1) % colors.length });
                    else updateCard(i, { revealed: true });
                };
                card.appendChild(inp);
                grid.appendChild(card);

                const capCard = document.createElement('div');
                capCard.className = `captain-card ${colors[c.colorIndex]} ${c.revealed ? 'played' : ''}`;
                capCard.innerHTML = `<span>${c.word || '...'}</span>`;
                captainGrid.appendChild(capCard);
            });
        }

        async function updateCard(i, p) { if (role==='editor') firebaseApi.update(firebaseApi.ref(db, `rooms/main/cards/${i}`), p); }
        window.handleStart = () => { if (role==='editor') firebaseApi.update(roomRef, { isGameMode: true }); };
        window.enableEditor = () => { if (role==='editor') firebaseApi.update(roomRef, { isGameMode: false }); };
        window.resetGame = () => { if (role==='editor' && confirm('Скинути?')) firebaseApi.set(roomRef, { isGameMode: false, cards: Array.from({length:25}, ()=>({word:'', colorIndex:0, revealed:false})) }); };

        init();
    </script>
</body>
</html>
